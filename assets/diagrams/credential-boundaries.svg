<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" role="img" aria-labelledby="title desc">
  <title id="title">Agentry credential boundaries</title>
  <desc id="desc">Customer applications and CI hold their own PostHog SDK and CLI credentials. Agentry alone holds encrypted read-only OAuth token material. The human owner, trusted deploy job, and one automation runner each use a separate Agentry credential with non-interchangeable authority.</desc>
  <defs>
    <style>
      .bg { fill: #0b0c0b; }
      .box { fill: #151615; stroke: #343734; stroke-width: 1; }
      .ph { fill: #79ff69; }
      .oauth { fill: #ffd166; }
      .ag { fill: #5cc8ff; }
      .heading { fill: #d9ddd9; font-family: Menlo, Monaco, monospace; font-size: 12px; letter-spacing: .02em; }
      .label { fill: #f3f5f3; font-family: Menlo, Monaco, monospace; font-size: 12px; }
      .sub { fill: #929992; font-family: Menlo, Monaco, monospace; font-size: 9px; }
      .foot { fill: #a8afa8; font-family: Menlo, Monaco, monospace; font-size: 9px; }
    </style>
  </defs>

  <rect class="bg" width="960" height="220"/>
  <text class="heading" x="20" y="25">fixed, non-interchangeable credential authority</text>

  <rect class="box" x="18" y="52" width="143" height="116"/>
  <rect class="ph" x="18" y="52" width="4" height="116"/>
  <text class="label" x="36" y="80">PostHog SDK</text>
  <text class="sub" x="36" y="102">customer app</text>
  <text class="sub" x="36" y="120">analytics + errors</text>
  <text class="sub" x="36" y="145">never Agentry</text>

  <rect class="box" x="174" y="52" width="143" height="116"/>
  <rect class="ph" x="174" y="52" width="4" height="116"/>
  <text class="label" x="192" y="80">PostHog CLI</text>
  <text class="sub" x="192" y="102">customer CI</text>
  <text class="sub" x="192" y="120">source maps</text>
  <text class="sub" x="192" y="145">direct to PostHog</text>

  <rect class="box" x="330" y="52" width="143" height="116"/>
  <rect class="oauth" x="330" y="52" width="4" height="116"/>
  <text class="label" x="348" y="80">OAuth read</text>
  <text class="sub" x="348" y="102">Agentry only</text>
  <text class="sub" x="348" y="120">encrypted tokens</text>
  <text class="sub" x="348" y="145">bounded PostHog reads</text>

  <rect class="box" x="486" y="52" width="143" height="116"/>
  <rect class="ag" x="486" y="52" width="4" height="116"/>
  <text class="label" x="504" y="80">Owner key</text>
  <text class="sub" x="504" y="102">human / local</text>
  <text class="sub" x="504" y="120">interactive control</text>
  <text class="sub" x="504" y="145">outside repository</text>

  <rect class="box" x="642" y="52" width="143" height="116"/>
  <rect class="ag" x="642" y="52" width="4" height="116"/>
  <text class="label" x="660" y="80">CI key</text>
  <text class="sub" x="660" y="102">trusted CI</text>
  <text class="sub" x="660" y="120">deploy + PR proof</text>
  <text class="sub" x="660" y="145">no PostHog access</text>

  <rect class="box" x="798" y="52" width="144" height="116"/>
  <rect class="ag" x="798" y="52" width="4" height="116"/>
  <text class="label" x="816" y="80">Runner key</text>
  <text class="sub" x="816" y="102">customer scheduler</text>
  <text class="sub" x="816" y="120">one automation</text>
  <text class="sub" x="816" y="145">draft PR at most</text>

  <text class="foot" x="480" y="196" text-anchor="middle">OAuth never enters CLI, repo, app, CI, runner, or prompt · credentials never change roles</text>
</svg>
